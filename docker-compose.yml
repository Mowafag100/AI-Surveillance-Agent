services:
  postgres:
    image: postgres:15
    container_name: surveillance-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-surveillance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-surveillance_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surveillance_user} -d ${POSTGRES_DB:-surveillance_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - surveillance_net
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: surveillance-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - surveillance_net
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: surveillance-agent
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-surveillance_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-surveillance_db}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./alerts:/app/alerts
      - ./models:/app/models
      - ./.env:/app/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - surveillance_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: surveillance-api
    environment:
      - PORT=8090
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-surveillance_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-surveillance_db}
      - REDIS_URL=redis://redis:6379
    ports:
      - "8095:8090"
    volumes:
      - ./logs:/app/logs
      - ./alerts:/app/alerts
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - surveillance_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  surveillance_net:
    driver: bridge

volumes:
  postgres_data:
